
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101322">
<title>SY AI Assistant</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #101322;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 20px;
  background: #191e35;
  border-bottom: 1px solid #303953;
  text-align: center;
}

header h2 { margin: 0; color: #8c9cff; }
header small { color: #aaa; }

.container {
  max-width: 750px;
  margin: 25px auto;
  padding: 15px;
}

.card {
  background: #1b2138;
  padding: 18px;
  border-radius: 15px;
  margin-bottom: 15px;
  border: 1px solid #303953;
}

h3 { margin-top: 0; color: #aabaff; }

label {
  display: block;
  margin: 12px 0 7px;
  color: #bbb;
  font-size: 14px;
}

select, textarea {
  width: 100%;
  padding: 13px;
  background: #292f49;
  color: white;
  border: 1px solid #46516a;
  border-radius: 9px;
  font-size: 15px;
  outline: none;
}

textarea { min-height: 85px; resize: vertical; }

button {
  padding: 13px 18px;
  border: 0;
  border-radius: 9px;
  background: #687cff;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled { opacity: .55; cursor: not-allowed; }
button.secondary { background: #303953; }
button.danger { background: #a53c50; }

#chat {
  height: 390px;
  overflow-y: auto;
  padding: 12px;
  background: #131a2b;
  border-radius: 10px;
  margin-bottom: 12px;
}

.msg {
  padding: 12px;
  margin: 10px 0;
  border-radius: 10px;
  background: #303953;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.5;
}

.msg.user {
  background: #465a9a;
  margin-left: 25px;
}

.msg.ai {
  background: #263b55;
  margin-right: 25px;
}

.msg.error { background: #642e3a; }

.speak-btn {
  display: block;
  margin-top: 12px;
  padding: 8px 13px;
  background: #465da8;
  border: 1px solid #7186d8;
  border-radius: 8px;
  font-size: 14px;
}

.status { color: #aaa; font-size: 13px; margin-top: 10px; }

.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 10px;
}

.actions button { flex: 1; }

.voice-row {
  display: flex;
  gap: 10px;
  margin-top: 8px;
}

.voice-row button { min-width: 75px; }

footer {
  text-align: center;
  padding: 25px;
  color: #888;
  font-size: 13px;
}

@media(max-width:500px) {
  .container { padding: 10px; margin: 12px auto; }
  #chat { height: 45vh; min-height: 260px; }
  header { padding: 17px; }
}
</style>
</head>

<body>

<header>
  <h2>SY AI ASSISTANT</h2>
  <small>GPT + Gemini Personal AI</small>
</header>

<main class="container">

  <section class="card">
    <h3>AI Settings</h3>

    <label for="model">Select AI Model</label>
    <select id="model">
      <option value="gemini">Google Gemini 2.5 Flash</option>
      <option value="gpt" disabled>OpenAI GPT (Coming Soon)</option>
    </select>

    <label for="language">Select Language</label>
    <select id="language">
      <option value="Hindi">Hindi</option>
      <option value="English">English</option>
      <option value="Hinglish">Hinglish</option>
    </select>

    <p class="status" id="connection">● Gemini Backend Ready</p>
  </section>

  <section class="card">
    <h3>AI Chat</h3>

    <div id="chat" aria-live="polite"></div>

    <label for="question">Your Message</label>
    <textarea id="question" placeholder="Apna message likho..."></textarea>

    <div class="voice-row">
      <button id="micBtn" type="button" class="secondary">🎤 बोलें</button>
      <button id="stopVoiceBtn" type="button" class="danger">⏹ आवाज़ बंद</button>
    </div>

    <p class="status" id="voiceStatus">Voice ready</p>

    <div class="actions">
      <button id="sendBtn" onclick="sendMessage()">Send Message</button>
      <button class="secondary" onclick="clearChat()">Clear Chat</button>
    </div>
  </section>

  <section class="card">
    <h3>Instagram Automation</h3>
    <p id="status" class="status">Instagram: Not Connected</p>
    <button class="secondary" onclick="instagramSetup()">Connect Instagram</button>
  </section>

</main>

<footer>
  © 2026 SY AI Assistant | Powered by Gemini
</footer>

<script>
const API_URL =
  "https://sy-ai-backend.sanjaysinghpatel307.workers.dev";

const chat = document.getElementById("chat");
const input = document.getElementById("question");
const sendBtn = document.getElementById("sendBtn");
const language = document.getElementById("language");
const model = document.getElementById("model");
const connection = document.getElementById("connection");
const micBtn = document.getElementById("micBtn");
const stopVoiceBtn = document.getElementById("stopVoiceBtn");
const voiceStatus = document.getElementById("voiceStatus");

function getSpeechLanguage() {
  if (language.value === "English") return "en-IN";
  return "hi-IN";
}

function speakText(text) {
  if (!("speechSynthesis" in window)) {
    voiceStatus.textContent = "Voice playback is not supported.";
    return;
  }

  window.speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = getSpeechLanguage();
  speech.rate = 0.9;
  speech.pitch = 1;

  speech.onstart = () => {
    voiceStatus.textContent = "🔊 SY AI बोल रहा है...";
  };

  speech.onend = () => {
    voiceStatus.textContent = "Voice ready";
  };

  speech.onerror = () => {
    voiceStatus.textContent = "आवाज़ नहीं चल पाई। सुनें बटन दबाएँ।";
  };

  window.speechSynthesis.speak(speech);
}

function addSpeakButton(div) {
  if (div.querySelector(".speak-btn")) return;

  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "speak-btn";
  btn.textContent = "🔊 सुनें";

  btn.onclick = () => {
    const text = div.dataset.messageText || "";
    speakText(text);
  };

  div.appendChild(btn);
}

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.dataset.messageText = text;
  div.textContent = text;

  if (type === "ai") addSpeakButton(div);

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;

  return div;
}

async function sendMessage() {
  const message = input.value.trim();

  if (!message) {
    input.focus();
    return;
  }

  if (model.value === "gpt") {
    addMessage("OpenAI GPT connection abhi setup nahi hua hai.", "error");
    return;
  }

  addMessage("You: " + message, "user");

  input.value = "";
  sendBtn.disabled = true;
  connection.textContent = "● Gemini is thinking...";

  const reply = addMessage("SY AI soch raha hai...", "ai");

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message: message,
        language: language.value
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "API Error");
    }

    const answer = data.reply || "No reply received";

    reply.dataset.messageText = answer;
    reply.textContent = answer;
    addSpeakButton(reply);

    connection.textContent = "● Gemini Connected";
    saveHistory();

    // Try automatic voice reply.
    // If mobile blocks automatic playback, tap the 🔊 सुनें button.
    speakText(answer);

  } catch (error) {
    reply.className = "msg error";
    reply.textContent = "Error: " + error.message;
    connection.textContent = "● Connection Error";
    saveHistory();

  } finally {
    sendBtn.disabled = false;
    chat.scrollTop = chat.scrollHeight;
    input.focus();
  }
}

function saveHistory() {
  try {
    const messages = Array.from(chat.querySelectorAll(".msg")).map(item => ({
      text: item.dataset.messageText || item.textContent,
      type: item.classList.contains("user") ? "user" :
            item.classList.contains("error") ? "error" : "ai"
    }));

    localStorage.setItem("sy_ai_history", JSON.stringify(messages));
  } catch (error) {
    console.log("History save error", error);
  }
}

function loadHistory() {
  try {
    const history = JSON.parse(
      localStorage.getItem("sy_ai_history") || "[]"
    );

    if (history.length) {
      chat.innerHTML = "";
      history.forEach(item => addMessage(item.text, item.type));
    } else {
      addMessage(
        "Namaste! Main SY AI hoon. Aap kya poochna chahte hain?",
        "ai"
      );
    }
  } catch (error) {
    console.log("History load error", error);
    addMessage("Namaste! Main SY AI hoon.", "ai");
  }
}

function clearChat() {
  if (!confirm("Clear all chat messages?")) return;

  chat.innerHTML = "";
  addMessage(
    "Namaste! Main SY AI hoon. Aap kya poochna chahte hain?",
    "ai"
  );

  localStorage.removeItem("sy_ai_history");

  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }
}

function instagramSetup() {
  alert("Instagram API connection abhi setup hona baki hai.");
}

// Voice input
const SpeechRecognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

let recognition = null;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = false;

  micBtn.addEventListener("click", () => {
    recognition.lang = getSpeechLanguage();

    try {
      recognition.start();
    } catch (error) {
      voiceStatus.textContent = "Microphone already active. Please wait.";
    }
  });

  recognition.onstart = () => {
    micBtn.textContent = "🔴 सुन रहा हूँ";
    voiceStatus.textContent = "बोलिए, SY AI सुन रहा है...";
  };

  recognition.onresult = (event) => {
    input.value = event.results[0][0].transcript;
    voiceStatus.textContent = "आपकी आवाज़ टेक्स्ट में बदल गई।";
    input.focus();
  };

  recognition.onerror = (event) => {
    voiceStatus.textContent = "Voice error: " + event.error;
    micBtn.textContent = "🎤 बोलें";
  };

  recognition.onend = () => {
    micBtn.textContent = "🎤 बोलें";
  };

} else {
  micBtn.disabled = true;
  voiceStatus.textContent = "इस browser में Voice Input supported नहीं है।";
}

stopVoiceBtn.addEventListener("click", () => {
  if (recognition) {
    try { recognition.stop(); } catch (error) {}
  }

  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }

  voiceStatus.textContent = "आवाज़ बंद कर दी गई।";
});

input.addEventListener("keydown", function(event) {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

loadHistory();
</script>

</body>
</html>
