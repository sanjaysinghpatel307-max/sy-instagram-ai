
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101322">
<title>SY AI Assistant</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #101322;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 20px;
  background: #191e35;
  border-bottom: 1px solid #303953;
  text-align: center;
}

header h2 {
  margin: 0;
  color: #8c9cff;
}

header small {
  color: #aaa;
}

.container {
  max-width: 750px;
  margin: 25px auto;
  padding: 15px;
}

.card {
  background: #1b2138;
  padding: 18px;
  border-radius: 15px;
  margin-bottom: 15px;
  border: 1px solid #303953;
}

h3 {
  margin-top: 0;
  color: #aabaff;
}

label {
  display: block;
  margin: 12px 0 7px;
  color: #bbb;
  font-size: 14px;
}

select, textarea {
  width: 100%;
  padding: 13px;
  background: #292f49;
  color: white;
  border: 1px solid #46516a;
  border-radius: 9px;
  font-size: 15px;
  outline: none;
}

textarea {
  min-height: 85px;
  resize: vertical;
}

button {
  padding: 13px 18px;
  border: 0;
  border-radius: 9px;
  background: #687cff;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

button.secondary {
  background: #303953;
}

button.danger {
  background: #a53c50;
}

#chat {
  height: 390px;
  overflow-y: auto;
  padding: 12px;
  background: #131a2b;
  border-radius: 10px;
  margin-bottom: 12px;
}

.msg {
  padding: 12px;
  margin: 10px 0;
  border-radius: 10px;
  background: #303953;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.5;
}

.msg.user {
  background: #465a9a;
  margin-left: 25px;
}

.msg.ai {
  background: #263b55;
  margin-right: 25px;
}

.msg.error {
  background: #642e3a;
}

.status {
  color: #aaa;
  font-size: 13px;
  margin-top: 10px;
}

.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 10px;
}

.actions button {
  flex: 1;
}

footer {
  text-align: center;
  padding: 25px;
  color: #888;
  font-size: 13px;
}

@media(max-width:500px) {
  .container {
    padding: 10px;
    margin: 12px auto;
  }

  #chat {
    height: 45vh;
    min-height: 260px;
  }

  header {
    padding: 17px;
  }
}
</style>
</head>

<body>

<header>
  <h2>SY AI ASSISTANT</h2>
  <small>GPT + Gemini Personal AI</small>
</header>

<main class="container">

  <section class="card">
    <h3>AI Settings</h3>

    <label for="model">Select AI Model</label>
    <select id="model">
      <option value="gemini">Google Gemini 2.5 Flash</option>
      <option value="gpt" disabled>OpenAI GPT (Coming Soon)</option>
    </select>

    <label for="language">Select Language</label>
    <select id="language">
      <option value="Hindi">Hindi</option>
      <option value="English">English</option>
      <option value="Hinglish">Hinglish</option>
    </select>

    <p class="status" id="connection">
      ● Gemini Backend Ready
    </p>
  </section>

  <section class="card">
    <h3>AI Chat</h3>

    <div id="chat" aria-live="polite">
      <div class="msg ai">
        Namaste! Main SY AI hoon.
        Aap kya poochna chahte hain?
      </div>
    </div>

    <label for="question">Your Message</label>
    <textarea
      id="question"
      placeholder="Apna message likho..."
    ></textarea>

    <div class="actions">
      <button id="sendBtn" onclick="sendMessage()">
        Send Message
      </button>

      <button class="secondary" onclick="clearChat()">
        Clear Chat
      </button>
    </div>
  </section>

  <section class="card">
    <h3>Instagram Automation</h3>

    <p id="status" class="status">
      Instagram: Not Connected
    </p>

    <button class="secondary"
      onclick="instagramSetup()">
      Connect Instagram
    </button>
  </section>

</main>

<footer>
  © 2026 SY AI Assistant | Powered by Gemini
</footer>

<script>
const API_URL =
  "https://sy-ai-backend.sanjaysinghpatel307.workers.dev";

const chat = document.getElementById("chat");
const input = document.getElementById("question");
const sendBtn = document.getElementById("sendBtn");
const language = document.getElementById("language");
const model = document.getElementById("model");
const connection = document.getElementById("connection");

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function sendMessage() {
  const message = input.value.trim();

  if (!message) {
    input.focus();
    return;
  }

  if (model.value === "gpt") {
    addMessage(
      "OpenAI GPT connection abhi setup nahi hua hai.",
      "error"
    );
    return;
  }

  addMessage("You: " + message, "user");

  input.value = "";
  sendBtn.disabled = true;
  connection.textContent = "● Gemini is thinking...";

  const reply = addMessage(
    "SY AI soch raha hai...",
    "ai"
  );

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: message,
        language: language.value
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "API Error");
    }

    reply.textContent = data.reply || "No reply received";

    connection.textContent = "● Gemini Connected";

    saveHistory();

  } catch (error) {
    reply.className = "msg error";
    reply.textContent = "Error: " + error.message;

    connection.textContent = "● Connection Error";

  } finally {
    sendBtn.disabled = false;
    chat.scrollTop = chat.scrollHeight;
    input.focus();
  }
}

function saveHistory() {
  try {
    const messages = Array.from(
      chat.querySelectorAll(".msg")
    ).map(item => ({
      text: item.textContent,
      type: item.className.replace("msg ", "")
    }));

    localStorage.setItem(
      "sy_ai_history",
      JSON.stringify(messages)
    );
  } catch (error) {
    console.log("History save error", error);
  }
}

function loadHistory() {
  try {
    const history = JSON.parse(
      localStorage.getItem("sy_ai_history") || "[]"
    );

    if (history.length) {
      chat.innerHTML = "";

      history.forEach(item => {
        addMessage(item.text, item.type);
      });
    }
  } catch (error) {
    console.log("History load error", error);
  }
}

function clearChat() {
  if (!confirm("Clear all chat messages?")) return;

  chat.innerHTML = "";

  addMessage(
    "Namaste! Main SY AI hoon. Aap kya poochna chahte hain?",
    "ai"
  );

  localStorage.removeItem("sy_ai_history");
}

function instagramSetup() {
  alert(
    "Instagram API connection abhi setup hona baki hai."
  );
}

input.addEventListener("keydown", function(event) {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

loadHistory();
</script>

</body>
</html>
